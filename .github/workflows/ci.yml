name: Continuous integration

on:
  push:
    branches: ["**"]
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        required: false

permissions: {}

jobs:
  runner-job:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    steps:
      - name: Check out repository code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Get pnpm store directory
        id: pnpm-cache
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        name: Setup pnpm cache
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - name: Install packages
        run: |
          pnpm install
      - name: Build
        run: |
          pnpm run production
      - name: Lint
        run: |
          pnpm run lint
      - name: Check types
        run: |
          pnpm run tsc
      - name: Check the code snippets in the docs
        run: |
          pnpm run docs-check
      - name: Clean coverage
        run: rm -rf .nyc_output && rm -rf node_modules/.vite
      - name: Run vitest tests
        run: pnpm run vitest
      - name: Playwright install
        run: npx playwright install chromium
      - name: Run playwright tests
        run: pnpm run playwright
      - name: Screenshots artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          if-no-files-found: ignore
          name: screenshots
          path: test-results/
      - name: Merge coverage
        run: cp js-coverage/coverage-final.json .nyc_output/coverage_jsdom.json
      - name: Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          directory: .nyc_output
          verbose: true

  # Font rendering differs per platform, so the screenshots are also compared
  # on Windows. A missing or different screenshot fails the job; the
  # windows-screenshots artifact has what Windows rendered. Copy it over the
  # snapshots with `node config/copyScreenshots.mjs <zip> windows`.
  windows-playwright:
    runs-on: windows-latest
    permissions:
      contents: read

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Get pnpm store directory
        id: pnpm-cache
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        name: Setup pnpm cache
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - name: Install packages
        run: |
          pnpm install
      - name: Playwright install
        run: npx playwright install chromium
      - name: Build
        run: COVERAGE=true npx rollup --config config/rollup.config.mjs
      - name: Run playwright tests
        run: npx playwright test --config config/playwright.config.js --update-snapshots=missing
      - name: Screenshots artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          if-no-files-found: ignore
          name: windows-screenshots
          path: test-results/
