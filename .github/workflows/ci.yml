name: Continuous integration

on:
  push:
    branches: ["**"]
  workflow_call:

jobs:
  runner-job:
    runs-on: ubuntu-latest

    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    steps:
      - name: Check out repository code
        uses: actions/checkout@v7
      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install pnpm
        run: npm install -g pnpm
      - name: Get pnpm store directory
        id: pnpm-cache
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT
      - uses: actions/cache@v6
        name: Setup pnpm cache
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - name: Install packages
        run: |
          pnpm install
      - name: Build
        run: |
          pnpm run production
      - name: Lint
        run: |
          pnpm run lint
      - name: Check types
        run: |
          pnpm run tsc
      - name: Check the code snippets in the docs
        run: |
          pnpm run docs-check
      - name: Clean coverage
        run: rm -rf .nyc_output && rm -rf node_modules/.vite
      - name: Run vitest tests
        run: pnpm run vitest
      - name: Playwright install
        run: npx playwright install chromium
      - name: Run playwright tests
        run: pnpm run playwright
      - name: Screenshots artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: ignore
          name: screenshots
          path: test-results/
      - name: Merge coverage
        run: cp js-coverage/coverage-final.json .nyc_output/coverage_jsdom.json
      - name: Codecov
        uses: codecov/codecov-action@v7
        with:
          directory: .nyc_output
          verbose: true

  # Font rendering differs per platform, so the screenshots are also compared
  # on Windows. Missing win32 snapshots are written and uploaded; the job
  # fails until they are committed.
  windows-playwright:
    runs-on: windows-latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository code
        uses: actions/checkout@v7
      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install pnpm
        run: npm install -g pnpm
      - name: Get pnpm store directory
        id: pnpm-cache
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT
      - uses: actions/cache@v6
        name: Setup pnpm cache
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - name: Install packages
        run: |
          pnpm install
      - name: Playwright install
        run: npx playwright install chromium
      - name: Build
        run: COVERAGE=true npx rollup --config config/rollup.config.mjs
      - name: Run playwright tests
        run: npx playwright test --config config/playwright.config.js --update-snapshots=missing
      - name: Windows snapshots artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: ignore
          name: windows-snapshots
          path: playwright/playwright.test.ts-snapshots/*-win32.png
      - name: Screenshots artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: ignore
          name: windows-screenshots
          path: test-results/
