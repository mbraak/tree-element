name: Release

# Triggered by the tag that `pnpm release` pushes. Runs the checks, publishes
# the package to npm and creates the GitHub release with the changelog section
# as its notes. Publishing uses npm trusted publishing: npmjs.com is configured
# to trust this workflow, so no token is needed and npm adds provenance.
on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  ci:
    uses: $/.github/workflows/ci.yml
    permissions:
      contents: read
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  publish:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
      id-token: write # npm trusted publishing and provenance

    steps:
      - name: Check out repository code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          # No caches in the release job, so a poisoned cache cannot end up in the package
          package-manager-cache: false
      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Install packages
        run: pnpm install
      - name: Check that the tag matches the version in package.json
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      - name: Build
        run: pnpm run production
      - name: Pack
        run: npm pack
      - name: Publish to npm
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if npm view "tree-element@$VERSION" version > /dev/null 2>&1; then
            echo "tree-element@$VERSION is already on npm, skipping publish"
          else
            npm publish --access public
          fi
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists, skipping"
          else
            node config/changelog.mjs notes "$VERSION" > release-notes.md
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes-file release-notes.md \
              "tree-element-$VERSION.tgz"
          fi
