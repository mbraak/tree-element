StylesPath = styles
MinAlertLevel = suggestion
Vocab = TreeElement

# Pinned so a new release of a style can't change the alerts unannounced.
Packages = https://github.com/vale-cli/Google/releases/download/v0.7.1/Google.zip, \
  https://github.com/vale-cli/proselint/releases/download/v0.3.4/proselint.zip

[*.md]
BasedOnStyles = Vale, Google, proselint
Google.Passive = NO
Google.Contractions = NO
Google.Parens = NO

# The typedoc output of the doc comments in src, generated by `pnpm docs-api`.
# Its headings are member names, such as autoEscape or tree.init, and the
# member names in its prose are code, not words to spell-check.
[**/reference/generated/**/*.md]
Google.Headings = NO
TokenIgnores = \b[a-z]+[A-Z][A-Za-z]*\b
